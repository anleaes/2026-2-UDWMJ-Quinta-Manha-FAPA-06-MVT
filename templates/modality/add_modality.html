{% extends 'base.html' %}

{% block title %}

    Adicionar Modalidade - {{ block.super }}

{% endblock title %}

{% block body %}

<br />
<b>Cadastro de Modalidade</b>
<br />
<br />
<form action="" method="POST" enctype="multipart/form-data">
{% csrf_token %}
    <label>Nome</label>
    <br />
    {{ form.name }}
    <br />
    <br />
    <label>Descrição</label>
    <br />
    {{ form.description }}
    <br />
    <br />
    <label>Máximo de alunos</label>
    <br />
    {{ form.max_students }}
    <br />
    <br />
    <label>Ícone</label>
    <br />
    {{ form.icon }}
    <br />
    <br />
    <button type="submit">Salvar</button>
</form>

{% endblock body %}
